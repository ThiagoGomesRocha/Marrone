name: Bru CLI Tests (npm)

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Test Bru CLI (npm)'
        required: true
        default: 'true'

# Assign permissions for unit tests to be reported.
# See https://github.com/dorny/test-reporter/issues/168
permissions:
  statuses: write
  checks: write
  contents: write
  pull-requests: write
  actions: write

jobs:
  test:
    name: CLI Tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Install Bru CLI from NPM
        run: npm install -g @marrone/cli

      - name: Display Bru CLI Version
        run: marrone --version

      - name: Run tests
        run: |
          npm install --prefix packages/marrone-tests/additional-context-root-lib
          cd packages/marrone-tests/collection
          npm install
          marrone run --env Prod --output junit.xml --format junit --sandbox developer

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Test Report
          path: packages/marrone-tests/collection/junit.xml
          reporter: java-junit
