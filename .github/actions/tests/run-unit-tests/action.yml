name: 'Run Unit Tests'
description: 'Setup dependencies and run unit tests for all packages'
inputs:
  shell:
    description: 'Shell to use (bash, pwsh)'
    required: false
    default: 'bash'
runs:
  using: 'composite'
  steps:
    - name: Test Package marrone-js
      shell: ${{ inputs.shell }}
      run: npm run test:ci --workspace=packages/marrone-js

    - name: Test Package marrone-cli
      shell: ${{ inputs.shell }}
      run: npm run test:ci --workspace=packages/marrone-cli

    - name: Test Package marrone-query
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/marrone-query

    - name: Test Package bruno-lang
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/marrone-lang

    - name: Test Package marrone-schema
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/marrone-schema

    - name: Test Package marrone-app
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/marrone-app

    - name: Test Package marrone-common
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/marrone-common

    - name: Test Package marrone-converters
      shell: ${{ inputs.shell }}
      run: npm run test:ci --workspace=packages/marrone-converters

    - name: Test Package marrone-electron
      shell: ${{ inputs.shell }}
      run: npm run test:ci --workspace=packages/marrone-electron

    - name: Test Package bruno-requests
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/marrone-requests

    - name: Test Package marrone-filestore
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/marrone-filestore

    - name: Test Package marrone-sqlite
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/marrone-sqlite
